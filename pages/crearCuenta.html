  <body>
    <header>
      <section><!-- barra anuncio oferta --></section>

      <section id="navbar_container">
        <!-- Navbar -->
        <!-- Añadido mediante JavaScript -->
      </section>
    </header>
    <main class="content container-fluid">
      <h1></h1>
    </main>

    <div class="container-fluid">
      <div class="row">
        <!-- Columna Izquierda -->
        <div class="col-md-7 col-12 p-4">
          <div class="image-section">
            <img
              id="image_fruit"
              src="../media/crearCuenta/imagenmercado.jpg"
              alt="Ilustración de mercado de frutas"
            />
          </div>
        </div>

        <!-- Columna derecha -->
        <div class="col-md-5 col-12 p-4">
          <div class="form-section">
            <h2>Crear una cuenta</h2>
            <p>Ingresa tus datos a continuación</p>

            <form id="formCrearCuenta">
              <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input
                  type="text"
                  id="nombreInput"
                  name="nombre"
                  placeholder="Nombre(s) Apellidos"
                  class="form-control"
                  required
                />
              </div>

              <div class="form-group">
                <label for="correo">Correo electrónico:</label>
                <input
                  type="email"
                  id="correo"
                  name="correo"
                  placeholder="correo@dominio.com"
                  class="form-control"
                  required
                />
              </div>

              <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input
                  type="telefono"
                  id="telefono"
                  name="telefono"
                  required
                  placeholder="Ingresa tu teléfono"
                  class="form-control"
                />
              </div>

              <div class="form-group">
                <label for="password">Contraseña:</label>
                <p class="password-hint">
                  Debe contener al menos 8 caracteres, debe incluir letras mayúsculas, minúsculas,
                  números y al menos un símbolo especial (@ ! ¿ ? $ # _ -)
                </p>
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  placeholder="Ingresa tu contraseña"
                  class="form-control"
                />
              </div>

              <div class="form-group">
                <label for="confirm-password">Confirma tu contraseña:</label>
                <input
                  type="password"
                  id="confirm-password"
                  name="confirm-password"
                  placeholder="Confirma tu contraseña"
                  required
                  class="form-control"
                />
              </div>

              <button type="submit" class="btn-primary">Crear cuenta</button>
            </form>

            <div class="login-link">
              ¿Ya tienes cuenta? <a href="../pages/iniciarSesion.html">Ingresar</a>

          </div>
        </div>
      </div>
    </div>

    <footer id="footer_container">
