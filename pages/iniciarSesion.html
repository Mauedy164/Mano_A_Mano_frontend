<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="../styles/aboutMe.css" />
    <link rel="stylesheet" href="../styles/main.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <section><!-- barra anuncio oferta --></section>

      <section id="navbar_container">
        <!-- Navbar -->
        <!-- Añadido mediante JavaScript -->
      </section>
    </header>
    <main class="content container-fluid">
      <h1></h1>
    </main>

    <div class="container-fluid">
      <div class="row align-items-center">
        <!-- Columna Izquierda -->
        <div class="col-md-7 col-12 p-4">
          <div class="container-fluid">
            <img
              class="img-fluid"
              id="image_fruit"
              src="../media/Login/Login.png"
              alt="Ilustración de mercado de frutas"
            />
          </div>
        </div>

        <!-- Columna derecha -->
        <div class="login-container col-md-5 col-12 p-4">
          <div class="form-section">
            <h2>Inicia sesión en Mano A Mano</h2>
            <p>Ingresa tus datos:</p>

            <form>
              <div class="form-group" id="correo_container">
                <label for="correo">Correo electrónico:</label>
                <input
                  type="email"
                  id="correo"
                  name="correo"
                  placeholder="correo@dominio.com"
                  class="form-control"
                />
              </div>

              <div class="form-group" id="password_container">
                <label for="password">Contraseña:</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Ingresa tu contraseña"
                  class="form-control"
                />
              </div>

              <button type="button" class="btn-primary" id="iniciaSesion_btn">
                Iniciar Sesión
              </button>
              <a href="./crearCuenta.html" style="text-decoration: none;"><button type="button" class="btn_crear_cuenta">
                Crear cuenta
              </button></a>
            </form>

            <div class="login-link">
              <a class="login" href="#">¿Olvidaste tu contraseña?</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer id="footer_container">
      <!-- Footer -->
      <!-- Añadido mediante JavaScript -->
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/main.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/validacionesInicioSesion.js"></script>
    <script src="../js/iniciarSesion.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
