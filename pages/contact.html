<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sobre nosotros</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/aboutMe.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    
  </head>

  <body>
    <header>
      <section><!-- barra anuncio oferta --></section>

      <section id="navbar_container">
        <!-- Navbar -->
        <!-- Añadido mediante JavaScript -->
      </section>
    </header>
    <main class="py-5 bg-light" class="content">
      <!-- Contacto -->

      <div class="container">
        <div class="row mb-4">
          <p class="text-muted">
            <a href="../index.html" class="text-decoration-none text-muted">Inicio</a>
            / <strong>Contacto</strong>
          </p>
        </div>

        <div class="row justify-content-center">
          <!-- CONTENEDOR FLEX -->
          <div class="d-flex flex-column flex-md-row gap-4 col-12">
            <!-- INFORMACIÓN DE NOSSOTROS-->
            <div class="info_container col-12 col-md-4 bg-white p-4 shadow-sm rounded">
              <div class="row info_contactanos mb-4">
                <section class="d-flex align-items-center gap-3 mb-3">
                  <img src="../media/contact/icons-phone.png" width="40" />
                  <h5 class="mb-0">Contáctanos</h5>
                </section>
                <section>
                  <p class="text-muted small">Estamos disponibles 24/7, los 7 días de la semana</p>
                  <p class="fw-semibold">Celular +5445125545</p>
                </section>
              </div>

              <hr />

              <div class="row info_escribenos mt-4">
                <section class="d-flex align-items-center gap-3 mb-3">
                  <img src="../media/contact/icons-mail.png" width="40" />
                  <h5 class="mb-0">Escríbenos</h5>
                </section>
                <section>
                  <p class="text-muted small">
                    Llena nuestro formulario y te contactaremos en menos de 24 horas.
                  </p>
                  <p class="mb-1">auxiliarmanoamano@gmail.com</p>
                </section>
              </div>
            </div>

            <!-- FORMULARIO -->
            <div class="form_container col-12 col-md-8 bg-white p-5 shadow-sm rounded">
              <form action="" id="miFormulario" method="post" novalidate>
                <fieldset class="user_data_container row g-3 mb-4">
                  <div class="col-md-4">
                    <label for="user_name">Nombre:</label>
                    <input
                      type="text"
                      id="user_name"
                      name="user_name"
                      class="form-control"
                      placeholder="Tu nombre"
                    />
                  </div>

                  <div class="col-md-4">
                    <label for="user_email">Correo:</label>
                    <input
                      type="email"
                      id="user_email"
                      name="user_email"
                      class="form-control"
                      placeholder="correo@dominio.com"
                    />
                  </div>

                  <div class="col-md-4">
                    <label for="user_phone">Número de teléfono:</label>
                    <input
                      type="tel"
                      id="user_phone"
                      name="user_phone"
                      class="form-control"
                      placeholder="5445125545"
                    />
                  </div>
                </fieldset>

                <fieldset class="message_container mb-4">
                  <label for="user_message">Mensaje:</label>
                  <textarea
                    id="user_message"
                    name="user_message"
                    rows="4"
                    class="form-control"
                    placeholder="Escríbenos tus inquietudes"
                  ></textarea>
                </fieldset>

                <div class="text-end">
                  <button type="submit" id="btn_form" name="btn_form" class="btn btn-danger px-4">
                    Enviar mensaje
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- Contacto -->

    <footer id="footer_container">
      <!-- Footer -->
      <!-- Añadido mediante JavaScript -->
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/main.js"></script>
    <script src="../js/contact.js"></script>
    <script src="../js/carrito.js"></script>
  </body>
</html>
